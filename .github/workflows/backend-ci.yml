name: 🐍 Backend CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    # Postgres real (mesmo motor do Neon) para conferir as migrations
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 🔍 Lint com Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: 🗄️ Migrations batem com os models (SQLite e Postgres)
        run: |
          DATABASE_URL="sqlite+aiosqlite:///./ci-migrations.db" alembic upgrade head
          DATABASE_URL="sqlite+aiosqlite:///./ci-migrations.db" alembic check
          export DATABASE_URL="postgresql://ci:ci@localhost:5432/ci"
          alembic upgrade head
          alembic upgrade head   # idempotente: a segunda vez não faz nada
          alembic check
          alembic current

      - name: 🧪 Executar testes
        env:
          # Sem DATABASE_URL, o backend usa SQLite local automaticamente
          DATABASE_URL: ""
          TREINO_API_URL: "http://localhost:5000/api/v1"
          TREINO_API_KEY: ""
          PYTHONPATH: "."
        run: pytest -v --tb=short
