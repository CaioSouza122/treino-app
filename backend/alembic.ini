# Migrations do banco (Alembic). A URL vem de DATABASE_URL via database/connection.py.
# Uso (dentro de backend/):
#   alembic upgrade head                      aplica as migrations pendentes
#   alembic revision --autogenerate -m "..."  cria uma migration a partir dos models

[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
